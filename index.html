.chips button.on,.row button.on{background:#2b2150;border-color:var(--pl)}
main{max-width:980px;margin:auto;padding:26px 16px 70px}
section{display:none}section.on{display:block;animation:in .25s}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.hub{cursor:pointer;font-size:1.15rem;font-weight:600;padding:24px 18px;transition:.15s}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

const F={Gaming:"Montre le contexte en 3 secondes, laisse monter la tension, puis le moment fort en ralenti avec ta réaction.",Défis:"Annonce la règle, montre une première tentative ratée, puis la réussite (ou l’échec) final avec le chrono visible.","Essais / Je teste":"Déballe, teste en direct, puis donne une note sur 10 avec une réaction sincère.",IRL:"Enchaîne 3 plans rapides sur place, glisse une surprise au milieu, puis résume en une phrase.",Réaction:"Montre l’extrait, coupe sur ton visage, puis donne ton avis en une seule phrase.",Humour:"Joue la scène en exagérant, puis place une chute inattendue dans les 2 dernières secondes.",Vlog:"Trois moments clés de la journée : un coup de stress, un moment de joie, une conclusion simple.",Expérience:"Montre le début, un moment difficile en cours de route, puis le résultat avec des chiffres à l’écran.",Prank:"Prépare discrètement, filme la réaction, puis révèle gentiment que c’était une blague.",Storytime:"Pose le décor, fais monter le malaise, puis donne la chute et la leçon retenue.",Découverte:"Présente la trouvaille, montre 3 points forts à l’écran, puis donne ton avis.",Challenge:"Annonce le défi, montre le compteur, rate une fois, puis réussis (ou perds) à la dernière seconde."};
const E={Gaming:"Dis ton score final et demande quel défi essayer ensuite.",Défis:"Annonce un défi encore plus dur et demande aux abonnés de voter.","Essais / Je teste":"Donne ton verdict et demande ce que tu dois tester ensuite.",IRL:"Dis où tu vas demain et invite à suggérer un lieu.",Réaction:"Demande quelle vidéo tu dois regarder ensuite.",Humour:"Demande à qui il faut envoyer cette vidéo.",Vlog:"Dis ce que tu prépares pour la suite.",Expérience:"Révèle ce que tu as appris et demande qui veut essayer.",Prank:"Demande qui sera la prochaine « victime » (gentiment).",Storytime:"Demande si ça t’est déjà arrivé et invite à raconter en commentaire.",Découverte:"Demande si tu connaissais déjà et invite à partager sa propre pépite.",Challenge:"Défie la communauté de battre ton score en commentaire."};
const CTA=["Abonne-toi pour la suite !","Like si tu veux la partie 2 !","Partage à un ami qui doit voir ça"];
const CATS=Object.keys(IDEAS).map((k,i)=>({n:k.split("|")[0],k,h:i*29+250}));
const ID=[],SC=[];
CATS.forEach(c=>{IDEAS[c.k].forEach(s=>{const[t,m]=s.split("|");ID.push({c,t,m})});TOP[c.n].forEach((t,i)=>SC.push({c,hook:H[c.n][i%2].replace("{t}",t),flow:F[c.n],end:E[c.n]+" "+CTA[i%3]}))});
$("#n1").textContent=GAMES.length+" jeux • 100+ défis par niveau";$("#n2").textContent=ID.length+" idées";$("#n3").textContent=SC.length+" scripts";

function show(p){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==p));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p==p));scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
const card=h=>{const d=document.createElement("div");d.className="card";d.innerHTML=h;return d};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const put=(el,node)=>{el.replaceChildren(node)};

// Défis gaming
let game=null,lvl=1;
function drawGames(){const q=$("#q").value.trim().toLowerCase(),box=$("#games");box.replaceChildren();
GAMES.filter(g=>g.toLowerCase().includes(q)).forEach(g=>{const b=document.createElement("button");b.textContent=g;if(g==game)b.className="on";b.onclick=()=>{game=g;$("#gSel").textContent=g;drawGames()};box.append(b)});
if(!box.children.length)box.textContent="Aucun jeu trouvé"}
$("#q").oninput=drawGames;drawGames();
LV.forEach((l,i)=>{const b=document.createElement("button");b.innerHTML=face(i)+" "+l.n;b.className=i==lvl?"on":"";b.onclick=()=>{lvl=i;[...$("#lv").children].forEach((x,j)=>x.className=j==i?"on":"")};$("#lv").append(b)});
const DK={},DL={},BAD=/parl|comment|chant|rimes|chuchot|blague|compliment|annonç|prononce/;
function deck(g,i){const sp=SP[g],q=GEN[g],out=new Set();
if(sp)sp[i].forEach(x=>out.add(x));
if(q){const A=q.length>5?[q[0],q[1],q[5]]:[q[0],q[1]],[,,r1,r2,r3]=q,tk=/parler/.test(q.slice(2).join(" "));
UU[i].filter(x=>!(tk&&BAD.test(x))).forEach(u=>{const o=[[[r1],[u],[r1,u]],[[r2],[u],[r2,u]],[[r1,r2],[r2,u],[r1,r2,u]],[[r2,r3,u],[r3,u],[r2,r3,r1,u]]][i];A.forEach(a=>o.forEach(c=>out.add(a+" "+J(c)+".")))})}
else GE[GG[g]||"aventure"][i].forEach(x=>out.add(x));
const d=[...out];for(let k=d.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[d[k],d[j]]=[d[j],d[k]]}return d}
function defi(g,i){const l=LV[i],key=g+"|"+i;let d=DK[key];
if(!d||!d.length){d=DK[key]=deck(g,i);if(d.length>1&&d[d.length-1]===DL[key])d.unshift(d.pop())}
const t=DL[key]=d.pop();
put($("#defR"),card(`<span class="tag">${ic("gamepad")} ${esc(g)}</span>${lt(i)}<p style="margin-top:8px"><b>${esc(t)}</b></p>`))}
$("#gen").onclick=()=>defi(game||pick(GAMES),lvl);
$("#rnd").onclick=()=>{game=pick(GAMES);lvl=Math.floor(Math.random()*4);$("#gSel").textContent=game;drawGames();[...$("#lv").children].forEach((x,j)=>x.className=j==lvl?"on":"");defi(game,lvl)};

// Idées & scripts
const ideaH=x=>`${ct(x.c)}<p><b>« ${esc(x.t)} »</b></p><p class="muted">${ic("image")} Miniature : ${esc(x.m)}</p>`;
const scrH=x=>`${ct(x.c)}<div class="sc"><div class="lab">${ic("mic")} HOOK</div><p>${esc(x.hook)}</p><div class="lab">${ic("book")} DÉROULEMENT</div><p>${esc(x.flow)}</p><div class="lab">${ic("flag")} FIN</div><p>${esc(x.end)}</p></div>`;
function setup(chipsId,data,fn,resId,genId,allId,gridClass){let cur=null;const box=$(chipsId);
[{n:"Toutes",all:1},...CATS].forEach(c=>{const b=document.createElement("button");b.innerHTML=(c.all?ic("dice"):dot(c))+" "+c.n;b.className=c.n=="Toutes"?"on":"";b.onclick=()=>{cur=c.n=="Toutes"?null:c.n;[...box.children].forEach(x=>x.className=x==b?"on":"")};box.append(b)});
const pool=()=>cur?data.filter(x=>x.c.n==cur):data;
$(genId).onclick=()=>put($(resId),card(fn(pick(pool()))));
$(allId).onclick=()=>{const g=document.createElement("div");g.className="grid";pool().forEach(x=>g.append(card(fn(x))));put($(resId),g)}}
setup("#ci",ID,ideaH,"#ideeR","#gi","#ai");setup("#cs",SC,scrH,"#scrR","#gs","#as");

// Surprise
$("#sur").onclick=()=>{const c=pick(CATS),i=pick(ID.filter(x=>x.c==c));put($("#surR"),card(ideaH(i)))};

// Communauté
const KEY="videafy_com",SEED=[{p:"Videafy",j:"Minecraft",c:"Survie",d:"DIFFICILE",t:"Terminer une aventure sans fabriquer d’armure."},{p:"Videafy",j:"Rocket League",c:"Speedrun",d:"MOYEN",t:"Marquer 5 buts en moins de 3 minutes."},{p:"Videafy",j:"Fortnite",c:"PvP",d:"IMPOSSIBLE",t:"Gagner une partie sans construire ni utiliser d’arme rare."}];
let list;try{list=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){list=[]}
const comCard=x=>card(`<span class="tag">${ic("gamepad")} ${esc(x.j)}</span>${lt(Math.max(0,["SIMPLE","MOYEN","DIFFICILE","IMPOSSIBLE"].findIndex(n=>(x.d||"").includes(n))))}<span class="tag">${ic("tag")} ${esc(x.c)}</span><p><b>${esc(x.t)}</b></p><p class="muted">${ic("user")} proposé par @${esc(x.p)}</p>`);
function drawCom(){const all=[...list,...SEED];[["#comL",all],["#homeCom",all.slice(0,6)]].forEach(([id,a])=>{const el=$(id);el.replaceChildren();a.forEach(x=>el.append(comCard(x)))})}
drawCom();
$("#f").onsubmit=e=>{e.preventDefault();const v=id=>$(id).value.trim(),fm=$("#fm");
if(!v("#fp")||!v("#fj")||!v("#ft")){fm.textContent="Remplis le pseudo, le jeu et la description.";return}
list.unshift({p:v("#fp").replace(/^@/,""),j:v("#fj"),c:$("#fc").value,d:$("#fd").value,t:v("#ft")});
try{localStorage.setItem(KEY,JSON.stringify(list))}catch(x){}
$("#f").reset();drawCom();fm.textContent="Défi publié ! Il apparaît ci-dessous.";$("#comL").scrollIntoView({behavior:"smooth"})};
document.querySelectorAll("[data-ic]").forEach(e=>{const i=ic(e.dataset.ic);if("big"in e.dataset||"bare"in e.dataset)e.innerHTML=i;else e.insertAdjacentHTML("afterbegin",i)});
</script></body></html>
